# /etc/nginx/sites-available/hcm.lbai.dev (link em sites-enabled). Certificado emitido pelo certbot.
server {
    listen 80;
    server_name hcm.lbai.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hcm.lbai.dev;

    ssl_certificate     /etc/letsencrypt/live/hcm.lbai.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hcm.lbai.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 20m;

    # Rota do próprio Next.js (aviso de nova versão) — vence o /api/ genérico por ser exata.
    location = /api/ui-version {
        proxy_pass         http://127.0.0.1:3090;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
